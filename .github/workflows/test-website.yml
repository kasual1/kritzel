# Runs the website Vitest contract checks when website files change.
name: Test website

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/website/**'
      - '.github/workflows/test-website.yml'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

jobs:
  test-website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        base-url: ['/', '/preview/']
    env:
      Docusaurus_BASE_URL: ${{ matrix.base-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run website tests
        run: npm run test -w apps/website

      - name: Build documentation and Markdown exports
        run: npm run build -w apps/website

      - name: Validate generated LLM documentation
        run: npm run test:llms -w apps/website