name: Test CLI

on:
  pull_request:
    paths:
      - 'libs/**'
      - 'scripts/bump-*.js'
      - 'scripts/check-shared-versions.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-cli.yml'
      - '.github/workflows/publish-libs.yml'
  push:
    branches-ignore:
      - main
    paths:
      - 'libs/**'
      - 'scripts/bump-*.js'
      - 'scripts/check-shared-versions.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-cli.yml'
      - '.github/workflows/publish-libs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cli:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.14.0', '24.18.0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check shared release versions
        run: node scripts/check-shared-versions.js
      - name: Build CLI
        run: npm run build -w libs/cli
      - name: Typecheck CLI
        run: npm run typecheck -w libs/cli
      - name: Test CLI
        run: npm run test:cli
      - name: Validate packed executable
        run: npm run test:pack -w libs/cli
      - name: Validate real package-manager workspace installations
        run: npm run test:managers -w libs/cli

  test-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check shared release versions
        run: node scripts/check-shared-versions.js
      - name: Build all libraries and CLI
        run: npm run build
      - name: Install browser for template smoke tests
        run: npx playwright install --with-deps chromium
      - name: Validate all six generated TypeScript integrations
        run: npm run test:cli:templates
