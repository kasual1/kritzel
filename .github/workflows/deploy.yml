name: Deploy to github pages
on:
  workflow_run:
    workflows: ["test"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
jobs:
  # --- Build Stencil Library ---
  build-stencil:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"

      - name: Install dependencies
        run: npm install

      - name: Build Kritzel Stencil components
        run: npm run build -w libs/kritzel-stencil

      - name: Upload Stencil dist
        uses: actions/upload-artifact@v5
        with:
          name: stencil-dist
          path: |
            libs/kritzel-stencil/dist
            libs/kritzel-stencil/loader

  # --- Build Docusaurus (after Stencil build, needs kritzel-react) ---
  build-docs:
    runs-on: ubuntu-latest
    needs: build-stencil
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"

      - name: Download Stencil dist
        uses: actions/download-artifact@v5
        with:
          name: stencil-dist
          path: libs

      - name: Install dependencies
        run: npm install

      - name: Build Kritzel React library
        run: npm run build -w libs/kritzel-react

      - name: Install Docusaurus dependencies
        run: |
          cd website
          npm install

      - name: Build Docusaurus documentation
        run: |
          cd website
          npm run build
        env:
          Docusaurus_BASE_URL: /${{ github.event.repository.name }}/

      - name: Upload docs artifact
        uses: actions/upload-artifact@v5
        with:
          name: docs-build
          path: website/build

  # --- Assemble and Deploy ---
  deploy:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v5
        with:
          name: docs-build
          path: _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
