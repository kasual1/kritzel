name: Deploy Docusaurus Docs and Angular App to GitHub Pages
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  # --- Build Stencil Library ---
  build-stencil:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Install dependencies
        run: npm install

      - name: Build Kritzel Stencil components
        run: npm run build -w libs/kritzel-stencil

      - name: Build Kritzel Angular library
        run: npm run build -w libs/kritzel-angular

      - name: Upload Stencil and Angular dist
        uses: actions/upload-artifact@v4
        with:
          name: stencil-dist
          path: |
            libs/kritzel-stencil/dist
            libs/kritzel-stencil/loader
            libs/kritzel-angular/dist/lib

  # --- Build Docusaurus (runs in parallel with build-stencil) ---
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Install Docusaurus dependencies
        run: |
          cd website
          npm install

      - name: Build Docusaurus documentation
        run: |
          cd website
          npm run build
        env:
          Docusaurus_BASE_URL: /${{ github.event.repository.name }}/

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: website/build

  # --- Run Unit Tests (after Stencil build) ---
  test-unit:
    runs-on: ubuntu-latest
    needs: build-stencil
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Download Stencil dist
        uses: actions/download-artifact@v4
        with:
          name: stencil-dist
          path: libs

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test

  # --- Run E2E Tests (after Stencil build, parallel with unit tests) ---
  test-e2e:
    runs-on: ubuntu-latest
    needs: build-stencil
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Download Stencil dist
        uses: actions/download-artifact@v4
        with:
          name: stencil-dist
          path: libs

      - name: Install dependencies
        run: npm install

      - name: Run e2e tests
        run: npm run e2e

      - name: Upload screenshot comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-comparison
          path: |
            libs/kritzel-stencil/screenshot/compare.html
            libs/kritzel-stencil/screenshot/images/
            libs/kritzel-stencil/screenshot/builds/

  # --- Build Angular Application (after Stencil build) ---
  build-angular:
    runs-on: ubuntu-latest
    needs: build-stencil
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Download Stencil dist
        uses: actions/download-artifact@v4
        with:
          name: stencil-dist
          path: libs

      - name: Install dependencies
        run: npm install

      - name: Install Angular app dependencies
        run: |
          cd demos/angular
          npm install

      - name: Build Angular application
        run: |
          cd demos/angular
          npm run build-app -- --base-href=/${{ github.event.repository.name }}/demo/

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
          path: demos/angular/dist/angular/browser

  # --- Assemble and Deploy ---
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build-docs, build-angular, test-unit, test-e2e]
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: _site

      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-build
          path: _site/demo

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
