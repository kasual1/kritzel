# Deploys the Docusaurus website to Cloudflare Pages
name: Deploy website

on:
  workflow_dispatch:

jobs:
  # --- Build Docusaurus ---
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Docusaurus documentation
        run: npm run build -w apps/website
        env:
          Docusaurus_BASE_URL: /

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: apps/website/build

  # --- Deploy to Cloudflare Pages ---
  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: build-docs
    timeout-minutes: 10
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-build
          path: _site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
