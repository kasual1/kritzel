# Builds the Stencil library, then runs unit tests and e2e tests in parallel.
name: Run tests

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
jobs:
  # --- Build Stencil Library ---
  build-stencil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Kritzel Stencil components
        run: npm run build -w libs/kritzel-stencil

      - name: Build Kritzel Angular library
        run: npm run build -w libs/kritzel-angular

      - name: Upload Stencil and Angular dist
        uses: actions/upload-artifact@v6
        with:
          name: stencil-dist
          path: |
            libs/kritzel-stencil/dist
            libs/kritzel-stencil/loader
            libs/kritzel-angular/dist/lib

  # --- Run Unit Tests (after Stencil build) ---
  test-unit:
    runs-on: ubuntu-latest
    needs: build-stencil
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Stencil dist
        uses: actions/download-artifact@v6
        with:
          name: stencil-dist
          path: libs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm run test

  # --- Run E2E Tests (after Stencil build, parallel with unit tests) ---
  test-e2e:
    runs-on: ubuntu-latest
    needs: build-stencil
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [angular, react, vue]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Stencil dist
        uses: actions/download-artifact@v6
        with:
          name: stencil-dist
          path: libs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Kritzel React library
        if: matrix.project == 'react'
        run: npm run build -w libs/kritzel-react

      - name: Build Kritzel Vue library
        if: matrix.project == 'vue'
        run: npm run build -w libs/kritzel-vue

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run functional e2e tests (${{ matrix.project }})
        run: npx playwright test --config=e2e/playwright.config.ts --project=e2e-${{ matrix.project }}
        env:
          E2E_PROJECT: e2e-${{ matrix.project }}

      - name: Run visual regression tests (${{ matrix.project }})
        run: npx playwright test --config=e2e/playwright.config.ts --project=${{ matrix.project }}
        env:
          E2E_PROJECT: ${{ matrix.project }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.project }}
          path: e2e/playwright-report/

      - name: Upload test results (screenshot diffs)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.project }}
          path: e2e/test-results/