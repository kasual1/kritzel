# Builds the core libraries, then runs unit tests and core/demo e2e tests in parallel.
name: Test libraries

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  # --- Build Libraries ---
  build-stencil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Kritzel libraries
        run: npm run build

      - name: Upload library dist
        uses: actions/upload-artifact@v7
        with:
          name: stencil-dist
          path: |
            libs/engine/core/dist
            libs/engine/core/loader
            libs/engine/angular/dist/lib
            libs/engine/react/dist
            libs/engine/vue/dist
            libs/editor/core/dist
            libs/editor/core/loader
            libs/editor/angular/dist/lib
            libs/editor/react/dist
            libs/editor/vue/dist

  # --- Run Unit Tests (after Stencil build) ---
  test-unit:
    runs-on: ubuntu-latest
    needs: build-stencil
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Stencil dist
        uses: actions/download-artifact@v8
        with:
          name: stencil-dist
          path: libs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm run test

  # --- Run Core E2E Tests (after Stencil build, parallel with other tests) ---
  test-core-e2e:
    runs-on: ubuntu-latest
    needs: build-stencil
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [angular, react, vue]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Stencil dist
        uses: actions/download-artifact@v8
        with:
          name: stencil-dist
          path: libs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Kritzel React library
        if: matrix.project == 'react'
        run: npm run build -w libs/editor/react

      - name: Build Kritzel Vue library
        if: matrix.project == 'vue'
        run: npm run build -w libs/editor/vue

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run core e2e tests (${{ matrix.project }})
        run: npx playwright test --config=apps/core/_e2e/playwright.config.ts --project=core-${{ matrix.project }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-core-${{ matrix.project }}
          path: apps/core/_e2e/playwright-report/

      - name: Upload test results (screenshot diffs)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-core-${{ matrix.project }}
          path: apps/core/_e2e/test-results/

  # --- Run Demo E2E Tests (after Stencil build, parallel with other tests) ---
  test-demos-e2e:
    runs-on: ubuntu-latest
    needs: build-stencil
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [angular, react, vue]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Stencil dist
        uses: actions/download-artifact@v8
        with:
          name: stencil-dist
          path: libs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Kritzel React library
        if: matrix.project == 'react'
        run: npm run build -w libs/editor/react

      - name: Build Kritzel Vue library
        if: matrix.project == 'vue'
        run: npm run build -w libs/editor/vue

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run demo e2e tests (${{ matrix.project }})
        run: npx playwright test --config=apps/demos/_e2e/playwright.config.ts --project=demos-${{ matrix.project }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-demos-${{ matrix.project }}
          path: apps/demos/_e2e/playwright-report/

      - name: Upload test results (screenshot diffs)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-demos-${{ matrix.project }}
          path: apps/demos/_e2e/test-results/