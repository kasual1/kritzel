name: Deploy Demos to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build libraries
        run: npm run build

      - name: Build Angular demo
        run: npm run build-app -w apps/demos/angular -- --base-href="${PAGES_BASE_PATH}angular/"

      - name: Build React demo
        run: npm run build-app -w apps/demos/react -- --base="${PAGES_BASE_PATH}react/"

      - name: Build Vue demo
        run: npm run build-app -w apps/demos/vue -- --base="${PAGES_BASE_PATH}vue/"

      - name: Assemble Pages site
        run: |
          mkdir -p dist-all/angular dist-all/react dist-all/vue
          cp -r apps/demos/angular/dist/angular/browser/. dist-all/angular/
          cp -r apps/demos/react/dist/. dist-all/react/
          cp -r apps/demos/vue/dist/. dist-all/vue/
          for app in angular react vue; do
            cp "dist-all/$app/index.html" "dist-all/$app/404.html"
          done
          touch dist-all/.nojekyll
          cat > dist-all/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Kritzel Demos</title>
            </head>
            <body>
              <h1>Kritzel Demos</h1>
              <ul>
                <li><a href="./angular/">Angular</a></li>
                <li><a href="./react/">React</a></li>
                <li><a href="./vue/">Vue</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist-all

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
