name: Deploy Demos to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      # The editor sources are mirrored from a private repo where these tsconfigs
      # extend a base config that lives above this repo's root, so rewrite them here.
      - name: Patch editor tsconfigs
        run: |
          cat > editor/react/tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "outDir": "./dist",
              "rootDir": "./lib",
              "lib": ["dom", "es2015"],
              "module": "esnext",
              "moduleResolution": "bundler",
              "target": "es2015",
              "strict": false,
              "skipLibCheck": true,
              "jsx": "react",
              "allowSyntheticDefaultImports": true,
              "declaration": true,
              "declarationDir": "./dist/types"
            },
            "include": ["lib"],
            "exclude": ["node_modules"]
          }
          EOF
          cat > editor/vue/tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "outDir": "./dist",
              "rootDir": "./lib",
              "lib": ["dom", "es2020"],
              "module": "esnext",
              "moduleResolution": "bundler",
              "target": "es2017",
              "strict": false,
              "skipLibCheck": true,
              "declaration": true
            },
            "include": ["lib"],
            "exclude": ["node_modules"]
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build editor packages
        run: npm run build:editor

      - name: Build demos
        run: npm run build:demos:pages

      - name: Assemble dist-all
        run: |
          mkdir -p dist-all/angular dist-all/react dist-all/vue
          cp -r demos/angular/dist/angular/browser/. dist-all/angular/
          cp -r demos/react/dist/. dist-all/react/
          cp -r demos/vue/dist/. dist-all/vue/
          for app in angular react vue; do
            cp dist-all/$app/index.html dist-all/$app/404.html
          done
          touch dist-all/.nojekyll
          cat > dist-all/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Kritzel Demos</title>
            </head>
            <body>
              <h1>Kritzel Demos</h1>
              <ul>
                <li><a href="./angular/">Angular</a></li>
                <li><a href="./react/">React</a></li>
                <li><a href="./vue/">Vue</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist-all'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
