# Builds the demo apps and publishes them to the gh-pages branch of kasual1/kritzel,
# so they are served at https://kasual1.github.io/kritzel/demos/{angular|react|vue}.

name: Deploy demos to GitHub Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Kritzel libraries
        run: npm run build

      - name: Build Angular demo
        run: npm run build-app -w apps/demos/angular -- --configuration production --base-href /kritzel/demos/angular/

      - name: Build React demo
        run: npm run build-app -w apps/demos/react -- --base=/kritzel/demos/react/

      - name: Build Vue demo
        run: npm run build-app -w apps/demos/vue -- --base=/kritzel/demos/vue/

      - name: Assemble pages output
        run: |
          mkdir -p pages-out/demos/angular pages-out/demos/react pages-out/demos/vue
          cp -r apps/demos/angular/dist/angular/browser/. pages-out/demos/angular/
          cp -r apps/demos/react/dist/. pages-out/demos/react/
          cp -r apps/demos/vue/dist/. pages-out/demos/vue/

      - name: Deploy to kasual1/kritzel gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: kasual1/kritzel
          publish_branch: gh-pages
          publish_dir: pages-out
          keep_files: true
