# Packs the publishable packages and checks that a minimal Angular, React and Vue starter for both the editor
# and the engine compiles against them and runs in a browser.
name: Test starters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-starters:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check shared release versions
        run: node scripts/check-shared-versions.js
      - name: Build all libraries
        run: npm run build
      - name: Install browser for starter smoke tests
        run: npx playwright install --with-deps chromium
      - name: Validate all six starters against the packed packages
        run: npm run test:starters
