# Builds the Stencil library, then runs unit tests and e2e tests in parallel
name: Run tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  # --- Build Stencil Library ---
  build-stencil:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"

      - name: Install dependencies
        run: npm install

      - name: Build Kritzel Stencil components
        run: npm run build -w libs/kritzel-stencil

      - name: Build Kritzel Angular library
        run: npm run build -w libs/kritzel-angular

      - name: Upload Stencil and Angular dist
        uses: actions/upload-artifact@v6
        with:
          name: stencil-dist
          path: |
            libs/kritzel-stencil/dist
            libs/kritzel-stencil/loader
            libs/kritzel-angular/dist/lib

  # --- Run Unit Tests (after Stencil build) ---
  test-unit:
    runs-on: ubuntu-latest
    needs: build-stencil
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"

      - name: Download Stencil dist
        uses: actions/download-artifact@v6
        with:
          name: stencil-dist
          path: libs

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test

  # --- Run E2E Tests (after Stencil build, parallel with unit tests) ---
  test-e2e:
    runs-on: ubuntu-latest
    needs: build-stencil
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [angular, react, vue]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"

      - name: Download Stencil dist
        uses: actions/download-artifact@v6
        with:
          name: stencil-dist
          path: libs

      - name: Install dependencies
        run: npm install

      - name: Build Kritzel React library
        if: matrix.project == 'react'
        run: npm run build -w libs/kritzel-react

      - name: Build Kritzel Vue library
        if: matrix.project == 'vue'
        run: npm run build -w libs/kritzel-vue

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests (${{ matrix.project }})
        run: npx playwright test --config=e2e/playwright.config.ts --project=${{ matrix.project }}

      - name: Upload screenshot comparison results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-comparison-${{ matrix.project }}
          path: |
            libs/kritzel-stencil/screenshot/compare.html
            libs/kritzel-stencil/screenshot/images/
            libs/kritzel-stencil/screenshot/builds/
            libs/kritzel-stencil/screenshot/screenshot-diff.js
            node_modules/@stencil/core/screenshot/compare/
