name: updraw-app

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  api:
    build:
      context: ./server/api
      dockerfile: Dockerfile.dev
    expose:
      - "3000"
    volumes:
      - ./server/api:/app
      - /app/node_modules
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      ASSET_MAX_SIZE_BYTES: ${ASSET_MAX_SIZE_BYTES}
    # GET / only answers once TypeORM has run the pending migrations (migrationsRun), so the websocket
    # server, which waits for a healthy api, never serves a half-migrated database (busybox wget).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy

  websocket:
    build:
      context: ./server/websocket
      dockerfile: Dockerfile.dev
    expose:
      - "1234"
    volumes:
      - ./server/websocket:/app
      - /app/node_modules
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_URL: ${API_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    # The Angular client runs on the host (npm run app:client) so it can use the local updraw libs.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - api
      - websocket

volumes:
  pgdata_dev:
