server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Service worker control files must never be cached, otherwise clients
    # keep running an outdated app version.
    location ~* ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|index\.html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # Hashed build output can be cached long term.
    location ~* \.(?:css|js|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Angular SPA fallback for deep links like /workspaceId
    location / {
        try_files $uri $uri/ /index.html;
    }
}
